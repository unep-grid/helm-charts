apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-search-{{ .Release.Name }}
  labels:
    app: search
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.search.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.search.persistence.size | default "4Gi" }}