{{- if and .Values.maintenance.workloadsScaledDown (not .Values.maintenance.routeActive) }}
{{- fail "maintenance.workloadsScaledDown requires maintenance.routeActive to be true" }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mx-app-{{ .Release.Name }}
  labels:
    app: app
spec:
  entryPoints:
    - {{ .Values.entryPoint }}
  routes:
  - kind: Rule
    match: Host(`app.{{ .Values.endPoint }}`)
    services:
    {{- if .Values.maintenance.routeActive }}
    - name: mx-maintenance-{{ .Release.Name }}
      port: 80
    {{- else }}
    - name: mx-app-{{ .Release.Name }}
      port: 3838
    {{- end }}
    middlewares:
      - name: mx-app-{{ .Release.Name }}
      - name: mx-{{ .Release.Name }}-compress
  tls:
    secretName: app.{{ .Values.endPoint }}
