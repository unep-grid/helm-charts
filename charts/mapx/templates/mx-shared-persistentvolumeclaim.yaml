{{- if eq (.Values.mapx.persistence.storageCustom | toString) "false" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-shared-{{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.mapx.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.mapx.persistence.size | default "50Gi" }}
{{- end }}