apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mx-geoserver-{{ .Release.Name }}
  labels:
    app: geoserver
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.geoserver.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.geoserver.persistence.size | default "4Gi" }}