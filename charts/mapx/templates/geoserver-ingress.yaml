apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mx-geoserver-{{ .Release.Name }}
  labels:
    app: geoserver
spec:
  entryPoints:
    - {{ .Values.entryPoint }}
  routes:
  - kind: Rule
    match: Host(`geoserver.{{ .Values.endPoint }}`)
    services:
    {{- if .Values.maintenance.routeActive }}
    - name: mx-maintenance-{{ .Release.Name }}
      port: 80
    {{- else }}
    - name: mx-geoserver-{{ .Release.Name }}
      port: 9000
    {{- end }}
    middlewares:
      - name: mx-geoserver-{{ .Release.Name }}
      - name: mx-{{ .Release.Name }}-compress
  tls:
    secretName: geoserver.{{ .Values.endPoint }}
