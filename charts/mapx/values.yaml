entryPoint: websecure
protocol: "https://"
endPoint: secret
portPublic: "443"
clusterIssuer: letsencrypt-staging

# list of nodes where to deploy the pods
# node selection is based on the kubernetes.io/hostname label
nodeAffinity:
  - secret

api:
  replicas: 2
  image: fredmoser/mapx_api
  tag: 1.14.1
  # ensure that the mx-shared volume has the right permissions and ownership
  # useful if mx-shared is an external volume mounted in the cluster e.g. NFS
  initContainers: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "1.5Gi"
      cpu: "500m"

app:
  replicas: 2
  image: fredmoser/mapx_app
  tag: 1.14.1
  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"

routines:
  resources:
    requests:
      memory: "384Mi"
      cpu: "500m"
    limits:
      memory: "768Mi"
      cpu: "1000m"

maintenance:
  # Enter maintenance by enabling routeActive first, then workloadsScaledDown.
  # Leave maintenance by disabling workloadsScaledDown first, then routeActive.
  # Route the application IngressRoute to the maintenance service when true.
  routeActive: false
  # Scale application workloads to zero when true. Redis remains running.
  workloadsScaledDown: false
  replicas: 2
  image: fredmoser/mapx_maintenance
  tag: 0.1.1
  apiHostPrefix: "api."
  end: "2026-10-28T14:00:00+02:00" # ISO 8601 date-time
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

geoserver:
  image: git.unepgrid.ch/mapx/mapx_geoserver
  tag: 2.28.5
  admin:
    username: secret
    password: secret
  contact:
    city: secret
    country: secret
    email: secret
    organisation: secret
    person: secret
  resources:
    requests:
      memory: "4Gi"
      cpu: "100m"
    limits:
      memory: "4Gi"
      cpu: "1000m"
  persistence:
    storageClassName: secret
    size: "4Gi"

redis:
  image: redis
  tag: 7.0.12
  resources:
    memory: "1Gi"
    cpu: "50m"

search:
  image: fredmoser/mapx_search
  tag: 1.48.2
  masterKey: secret
  resources:
    requests:
      memory: "2Gi"
      cpu: "200m"
    limits:
      memory: "3Gi"
      cpu: "300m"
  persistence:
    storageClassName: secret
    size: "4Gi"
  logLevel: "info"

pycsw:
  replicas: 2
  image: fredmoser/mapx_pycsw
  tag: 3.0-dev-mapx.1
  resources:
    requests:
      memory: "384Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  table: mx_pycsw_records

postgres:
  host: db.staging.mapx.org
  db: mapx
  port: "5432"
  keyEncrypt: secret
  password:
    master: secret
    userCustom: secret
    userRead: secret
    userWrite: secret

smtp:
  user: secret
  password: secret
  host: secret
  port: secret
  from: secret

mapx:
  mode: "[]"
  projectDefault: "MX-3ZK-82N-DY8-WU2-IGF"
  devMembers: "[1]"
  projectCreators: "[1]"
  rootModeMembers: "[1]"
  docsUrl: secret
  s3ProxyBaseUrl: secret
  mirror:
    rateLimit: "2000"
    rateWindowMinutes: "15"
  maptilerToken: secret
  maxmindUrlDownload: secret
  persistence:
    storageCustom: false
    storageClassName: secret
    size: "50Gi"
  contacts:
    admin: secret
    bot: secret
    guest: secret
    info: secret
    issues: secret

# additional manifests to deploy as an array
additionalManifests:
  []
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: mx-extra-config-{{ .Release.Name }}
  #   data:
  #     extra-data: "value"
